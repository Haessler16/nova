services:
  postgres:
    image: postgres:17
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_local_only
      POSTGRES_DB: nova_pms
    ports:
      - '5432:5432'
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova -d nova_pms']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: nova-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - nova_redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nova_postgres_data:
  nova_redis_data:
