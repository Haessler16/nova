name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_local_only
          POSTGRES_DB: nova_pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      AUTH_MODE: dev-header
      DATABASE_URL: postgresql://nova:nova_local_only@localhost:5432/nova_pms?schema=public
      REDIS_URL: redis://localhost:6379
      AUDIT_METADATA_MAX_BYTES: '8192'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate schema
        run: pnpm exec prisma validate

      - name: Format check
        run: pnpm format:check

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Seed synthetic data
        run: pnpm db:seed

      - name: Verify manual database integrity objects
        run: pnpm db:verify

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E tests (dev-header tenant/inventory)
        run: pnpm test:e2e

      - name: E2E tests (local-session authentication)
        run: pnpm test:e2e:auth
